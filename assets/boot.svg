<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-labelledby="title desc">
  <title id="title">BOINRED — game server boot log</title>
  <desc id="desc">Server uptime 2008 to now. Class: Game Server Programmer. Class change: CEO and TD to CTO. Shards online: Lineage M and Lineage. Skills: C++, C#, TypeScript, Python.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .log  { font-size: 15px; fill: #a9b1d6; white-space: pre; }
    .ok   { fill: #9ece6a; font-weight: 700; }
    .dim  { fill: #565f89; }
    .val  { fill: #7dcfff; }
    .hl   { fill: #e0af68; }
    .cmd  { fill: #c0caf5; }
    .line { opacity: 0; animation: show .01s linear forwards; }
    .l1 { animation-delay: 1.3s; } .l2 { animation-delay: 1.7s; } .l3 { animation-delay: 2.1s; }
    .l4 { animation-delay: 2.5s; } .l5 { animation-delay: 2.9s; } .l6 { animation-delay: 3.5s; }
    .typer { animation: type 1s steps(26) .2s forwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .led  { animation: blink 1.6s steps(1) infinite; }
    .led.b { animation-duration: 1.1s; animation-delay: .3s; }
    .led.c { animation-duration: 2.3s; animation-delay: .7s; }
    @keyframes show  { to { opacity: 1; } }
    @keyframes type  { to { transform: translateX(240px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1; }
      .typer { display: none; }
      .cursor, .led { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset=".55" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#f7768e"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect width="860" height="380" rx="14" fill="#1a1b27"/>
  <path d="M0 14a14 14 0 0 1 14-14h832a14 14 0 0 1 14 14v22H0z" fill="#16161e"/>
  <circle cx="22" cy="18" r="6" fill="#f7768e"/>
  <circle cx="42" cy="18" r="6" fill="#e0af68"/>
  <circle cx="62" cy="18" r="6" fill="#9ece6a"/>
  <text x="430" y="23" text-anchor="middle" class="mono" font-size="13" fill="#565f89">boinred@game-server: ~</text>

  <!-- title -->
  <text x="40" y="112" class="mono" font-size="66" font-weight="800" letter-spacing="8" fill="url(#brand)">BOINRED</text>
  <text x="42" y="146" class="mono" font-size="14" letter-spacing="3" fill="#565f89">GAME SERVER ENGINEER  ·  FOUNDER  ·  CTO</text>

  <!-- server rack -->
  <g transform="translate(690 58)">
    <rect width="120" height="100" rx="8" fill="#16161e" stroke="#292e42" stroke-width="2"/>
    <g fill="#24283b">
      <rect x="12" y="12" width="96" height="20" rx="3"/>
      <rect x="12" y="40" width="96" height="20" rx="3"/>
      <rect x="12" y="68" width="96" height="20" rx="3"/>
    </g>
    <g fill="#414868">
      <rect x="22" y="20" width="44" height="4" rx="2"/>
      <rect x="22" y="48" width="44" height="4" rx="2"/>
      <rect x="22" y="76" width="44" height="4" rx="2"/>
    </g>
    <circle class="led"   cx="84" cy="22" r="3.5" fill="#9ece6a"/>
    <circle class="led b" cx="96" cy="22" r="3.5" fill="#7dcfff"/>
    <circle class="led c" cx="84" cy="50" r="3.5" fill="#9ece6a"/>
    <circle class="led"   cx="96" cy="50" r="3.5" fill="#e0af68"/>
    <circle class="led b" cx="84" cy="78" r="3.5" fill="#9ece6a"/>
    <circle class="led c" cx="96" cy="78" r="3.5" fill="#bb9af7"/>
  </g>

  <line x1="40" y1="176" x2="820" y2="176" stroke="#292e42" stroke-width="1"/>

  <!-- boot log -->
  <g class="mono log">
    <text x="40" y="208"><tspan class="ok">$</tspan><tspan class="cmd"> ./boot --player boinred</tspan></text>
    <rect class="typer" x="52" y="192" width="240" height="22" fill="#1a1b27"/>

    <text class="line l1" x="40" y="236"><tspan class="ok">[  OK  ]</tspan> Server uptime <tspan class="dim">...........</tspan> <tspan class="val">2008 -&gt; now</tspan></text>
    <text class="line l2" x="40" y="262"><tspan class="ok">[  OK  ]</tspan> Loading class <tspan class="dim">...........</tspan> <tspan class="val">Game Server Programmer</tspan></text>
    <text class="line l3" x="40" y="288"><tspan class="ok">[  OK  ]</tspan> Class change <tspan class="dim">............</tspan> <tspan class="val">CEO &amp; TD -&gt; CTO</tspan></text>
    <text class="line l4" x="40" y="314"><tspan class="ok">[  OK  ]</tspan> Shards online <tspan class="dim">...........</tspan> <tspan class="val">Lineage M / Lineage</tspan></text>
    <text class="line l5" x="40" y="340"><tspan class="ok">[  OK  ]</tspan> Equipping skills <tspan class="dim">........</tspan> <tspan class="val">C++ / C# / TypeScript / Python</tspan></text>
    <g class="line l6">
      <text x="40" y="366"><tspan class="hl">&gt; PRESS START</tspan></text>
      <rect class="cursor" x="170" y="353" width="10" height="17" fill="#e0af68"/>
    </g>
  </g>
</svg>
