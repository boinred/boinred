<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290" role="img" aria-labelledby="title desc">
  <title id="title">Inventory — skills</title>
  <desc id="desc">Languages: C++, C#, JavaScript, TypeScript, Python. Frameworks and tools: .NET, Angular, Unity, SQL Server, Git.</desc>
  <style>
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .label { font-size: 12px; letter-spacing: 3px; fill: #565f89; font-weight: 700; }
    .name  { font-size: 16px; fill: #c0caf5; font-weight: 700; }
    .slot  { opacity: 0; animation: drop .35s ease-out forwards; }
    .s1 { animation-delay: .1s; } .s2 { animation-delay: .2s; } .s3 { animation-delay: .3s; } .s4 { animation-delay: .4s; } .s5 { animation-delay: .5s; }
    .s6 { animation-delay: .7s; } .s7 { animation-delay: .8s; } .s8 { animation-delay: .9s; } .s9 { animation-delay: 1s; } .s10 { animation-delay: 1.1s; }
    @keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .slot { animation: none; opacity: 1; } }
  </style>

  <rect width="860" height="290" rx="14" fill="#1a1b27"/>
  <path d="M0 14a14 14 0 0 1 14-14h832a14 14 0 0 1 14 14v26H0z" fill="#16161e"/>
  <text x="30" y="26" class="mono" font-size="13" font-weight="700" letter-spacing="4" fill="#bb9af7">INVENTORY</text>
  <text x="830" y="26" text-anchor="end" class="mono" font-size="12" fill="#565f89">10 / 10 slots</text>

  <text x="30" y="74" class="mono label">LANGUAGES</text>
  <text x="30" y="184" class="mono label">FRAMEWORKS &amp; TOOLS</text>

  <!-- slot: translate(x y), accent color on stroke + gem -->
  <g class="mono">
    <g transform="translate(30 86)"><g class="slot s1"><rect width="148" height="64" rx="8" fill="#16161e" stroke="#00599C" stroke-width="2"/><rect x="16" y="26" width="12" height="12" transform="rotate(45 22 32)" fill="#00599C"/><text x="40" y="38" class="name">C++</text></g></g>
    <g transform="translate(193 86)"><g class="slot s2"><rect width="148" height="64" rx="8" fill="#16161e" stroke="#239120" stroke-width="2"/><rect x="16" y="26" width="12" height="12" transform="rotate(45 22 32)" fill="#239120"/><text x="40" y="38" class="name">C#</text></g></g>
    <g transform="translate(356 86)"><g class="slot s3"><rect width="148" height="64" rx="8" fill="#16161e" stroke="#F7DF1E" stroke-width="2"/><rect x="16" y="26" width="12" height="12" transform="rotate(45 22 32)" fill="#F7DF1E"/><text x="40" y="38" class="name">JavaScript</text></g></g>
    <g transform="translate(519 86)"><g class="slot s4"><rect width="148" height="64" rx="8" fill="#16161e" stroke="#3178C6" stroke-width="2"/><rect x="16" y="26" width="12" height="12" transform="rotate(45 22 32)" fill="#3178C6"/><text x="40" y="38" class="name">TypeScript</text></g></g>
    <g transform="translate(682 86)"><g class="slot s5"><rect width="148" height="64" rx="8" fill="#16161e" stroke="#3776AB" stroke-width="2"/><rect x="16" y="26" width="12" height="12" transform="rotate(45 22 32)" fill="#FFD43B"/><text x="40" y="38" class="name">Python</text></g></g>

    <g transform="translate(30 196)"><g class="slot s6"><rect width="148" height="64" rx="8" fill="#16161e" stroke="#512BD4" stroke-width="2"/><rect x="16" y="26" width="12" height="12" transform="rotate(45 22 32)" fill="#512BD4"/><text x="40" y="38" class="name">.NET</text></g></g>
    <g transform="translate(193 196)"><g class="slot s7"><rect width="148" height="64" rx="8" fill="#16161e" stroke="#DD0031" stroke-width="2"/><rect x="16" y="26" width="12" height="12" transform="rotate(45 22 32)" fill="#DD0031"/><text x="40" y="38" class="name">Angular</text></g></g>
    <g transform="translate(356 196)"><g class="slot s8"><rect width="148" height="64" rx="8" fill="#16161e" stroke="#c0caf5" stroke-width="2"/><rect x="16" y="26" width="12" height="12" transform="rotate(45 22 32)" fill="#c0caf5"/><text x="40" y="38" class="name">Unity</text></g></g>
    <g transform="translate(519 196)"><g class="slot s9"><rect width="148" height="64" rx="8" fill="#16161e" stroke="#CC2927" stroke-width="2"/><rect x="16" y="26" width="12" height="12" transform="rotate(45 22 32)" fill="#CC2927"/><text x="40" y="38" class="name">SQL Server</text></g></g>
    <g transform="translate(682 196)"><g class="slot s10"><rect width="148" height="64" rx="8" fill="#16161e" stroke="#F05032" stroke-width="2"/><rect x="16" y="26" width="12" height="12" transform="rotate(45 22 32)" fill="#F05032"/><text x="40" y="38" class="name">Git</text></g></g>
  </g>
</svg>
